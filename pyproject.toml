[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sinav-takvimi"
version = "0.1.0"
description = "Üniversite sınav takvimi ve gözetmen ataması optimizasyonu"
requires-python = ">=3.12"
dependencies = [
    "PySide6>=6.8",
    "streamlit>=1.40",
    "openpyxl>=3.1",
    "matplotlib>=3.9",
]

[project.gui-scripts]
sinav-takvimi-masaustu = "sinav_takvimi.arayuz.masaustu:uygulamayi_baslat"

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "hypothesis>=6", "ruff>=0.6", "mypy>=1.11", "pyinstaller>=6.11"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["B024"]  # Kisit: ortak taban sınıf, soyut metotlar alt sınıflarda

[tool.mypy]
python_version = "3.12"
files = ["src"]
ignore_missing_imports = true
check_untyped_defs = true
